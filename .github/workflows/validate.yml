name: Plugin gate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Checkout tested Hermes runtime
        uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          ref: 2bd378ed1b8d6bf2192cb26e0a55ff3091e6bd19  # v0.23.0
          path: .hermes-runtime
      - uses: astral-sh/setup-uv@v6
      - name: Install Hermes from its own lockfile
        run: uv sync --frozen --python 3.14 --directory .hermes-runtime
      - run: python -m unittest discover -s plugin/tests -v
      - name: Real validator receipt (no credentials)
        run: |
          mkdir -p receipts
          HERMES_HOME="$RUNNER_TEMP/hermes-home" .hermes-runtime/.venv/bin/hermes plugins validate plugin --json > receipts/validate.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: plugin-validation
          path: receipts/
