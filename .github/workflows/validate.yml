name: Plugin gate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: plugin
          fetch-depth: 0  # the regression-test check reads the pull request's commits
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
      - name: Desktop build is current (rebuild desktop/plugin.js and fail on any diff)
        working-directory: plugin
        run: |
          python desktop/build.py
          git diff --exit-code -- desktop design
      - name: Checkout tested Hermes runtime
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: NousResearch/hermes-agent
          ref: 2bd378ed1b8d6bf2192cb26e0a55ff3091e6bd19  # v0.23.0
          path: .hermes-runtime
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
      - name: Install Hermes from its own lockfile
        run: uv sync --frozen --python 3.14 --directory .hermes-runtime
      - name: Tests in the Hermes runtime (pytest collects the plain test functions; a skipped test fails the gate)
        run: |
          set -o pipefail
          uv pip install --python .hermes-runtime/.venv/bin/python pytest==9.1.1 hypothesis==6.135.0
          cd plugin
          HERMES_HOME="$RUNNER_TEMP/hermes-test-home" ../.hermes-runtime/.venv/bin/python -m pytest -q -rs -p no:cacheprovider tests 2>&1 | tee ../test.log
          # Hermes is installed in this job, so the Hermes-equivalence test runs here: any skip is a failure.
          if grep -q "^SKIPPED" ../test.log; then grep "^SKIPPED" ../test.log; echo "::error::tests were skipped; the gate needs every test to run"; exit 1; fi
      - name: Each new regression test fails without its fix (pull requests only)
        if: github.event_name == 'pull_request'
        working-directory: plugin
        env:
          BASE_REF: ${{ github.base_ref }}
        run: HERMES_HOME="$RUNNER_TEMP/hermes-bite-home" ../.hermes-runtime/.venv/bin/python .github/scripts/new_tests_bite.py --base "origin/$BASE_REF"
      - name: Real validator receipt (no credentials)
        run: |
          mkdir -p receipts
          HERMES_HOME="$RUNNER_TEMP/hermes-home" .hermes-runtime/.venv/bin/hermes plugins validate plugin --json > receipts/validate.json
          python3 -c 'import json,sys; d=json.load(open("receipts/validate.json")); sys.exit(0 if d.get("ok") is True else "validator did not report ok: %s" % d)'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: plugin-validation
          path: receipts/
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
      - name: Install ruff (exact version)
        run: python -m pip install ruff==0.16.5
      - name: Lint (rules and ignores live in ruff.toml)
        run: ruff check .
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
      - name: Install mypy (exact version)
        run: python -m pip install mypy==1.18.2
      - name: Type check (fails on any error not in .github/mypy-baseline.txt)
        run: python .github/scripts/typecheck.py
