name: Plugin gate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Checkout tested Hermes runtime
        uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          ref: 2bd378ed1b8d6bf2192cb26e0a55ff3091e6bd19  # v0.23.0
          path: .hermes-runtime
      - run: python -m pip install -e ./.hermes-runtime
      - run: python -m unittest discover -s tests -v
      - name: Real validator receipt (no credentials)
        run: |
          mkdir -p receipts
          hermes plugins validate . --json > receipts/validate.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: plugin-validation
          path: receipts/
