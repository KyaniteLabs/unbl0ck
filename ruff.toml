# Lint scope for the CI `lint` job: pyflakes plus the pycodestyle error classes
# that indicate real defects. Style-only rules are deliberately off.
target-version = "py314"

[lint]
select = ["E4", "E7", "E9", "F"]
ignore = [
  "E701",  # one-line `if x: y` is the house style in this codebase
  "E702",  # `a; b` one-liners, same house style
  "E741",  # short names such as `l` in comprehensions, no ambiguity in context
  "E731",  # a named lambda in a test helper is clearer than a def
  "E402",  # tests and design scripts add sys.path before importing local modules
]

[lint.per-file-ignores]
# Production findings left untouched on purpose (no production changes in this lane):
"dashboard/plugin_api.py" = ["F811"]  # `kanban_db` is imported twice inside answer(); harmless, left for a behaviour-reviewed change
"design/mascot/conv.py" = ["E401", "F841"]  # one-off design asset script, not shipped code
"desktop/build.py" = ["E401"]  # `import base64, json, pathlib`; style only
