name: unbl0ck
label: UNBL0CK
version: "0.4.5"
description: >
  UNBL0CK clears whatever is blocked on you. One queue of everything waiting on you: blocked Kanban cards that need your
  answer, chats on any platform whose last turn is a bot asking you something, agents paused right now on a
  clarify question, command approval or admin password prompt, and new people waiting for you to approve their pairing request.
  Answer a card in place and it is commented and unblocked through native
  Kanban; read its full context; ask a read-only assistant about it and decide
  without leaving the card; open a chat straight from the queue. Desktop gets an /unblock page
  and a status-bar count.
author: KyaniteLabs
license: MIT
requires_hermes: ">=0.23.0"
provides_tools: []
provides_hooks: [on_human_input_request, on_human_input_resolved]
provides_middleware: []
config_schema:
  principal_name:
    type: str
    default: ""
    description: "Your name(s) as agents write them in block reasons and chats, comma-separated (e.g. \"Ada, Ada Lovelace\"). CEO, principal and human always count."
  comment_author:
    type: str
    default: ""
    description: "Author name used when UNBL0CK comments your answer on a Kanban card. Defaults to the first principal_name, else \"user\"."
  ask_enabled:
    type: bool
    default: true
    description: "Show the in-panel 'Ask about this card' chat. When you press Send, the card's content and your question go to the model provider configured in Hermes through its plugin LLM API."
  owner_user_ids:
    type: str
    default: ""
    description: "Your own user ids on gateway platforms (Discord, Telegram, ...), comma-separated. When set, a gateway chat with anyone else is not listed as asking you. When empty, such cards say who the chat is with."
  bluf_enabled:
    type: bool
    default: true
    description: "Lead each card with a one-line model-written summary. Each new or changed Kanban card's or chat's title and text are sent once to the model provider configured in Hermes (through its plugin LLM API) and the summary is cached in plugin-data. Set false to send nothing automatically."
