name: unbl0ck
label: UNBL0CK
version: "0.5.1"
description: >
  UNBL0CK clears whatever is blocked on you. One queue of everything waiting on you: blocked Kanban cards that need your
  answer, chats on any platform whose last turn is a bot asking you something, agents paused right now on a
  clarify question, command approval or admin password prompt, new people waiting for you to approve their pairing request,
  and drafts, call notes or other items outside Hermes filed by your agent or read from watched folders.
  Answer a card in place and it is commented and unblocked through native
  Kanban; read its full context; ask a read-only assistant about it and decide
  without leaving the card; open a chat straight from the queue. Desktop gets an /unblock page
  and a status-bar count.
author: KyaniteLabs
license: MIT
requires_hermes: ">=0.23.0"
provides_tools: [unbl0ck_file]
provides_hooks: [on_human_input_request, on_human_input_resolved]
provides_middleware: []
config_schema:
  principal_name:
    type: str
    default: ""
    description: "Your name(s) as agents write them in block reasons and chats, comma-separated (e.g. \"Ada, Ada Lovelace\"). The words in role_words, plus principal and human, always count."
  role_words:
    type: str
    default: "CEO"   # role-words default
    description: "Title words agents use for you in block reasons, comma-separated (e.g. \"Boss, founder\"). Matched like your name."
  pocket_authority:
    type: str
    default: "owner"
    description: "The authority label on pocket-pack decision cards. Set it to the word your pocket device expects."
  ask_history_turns:
    type: int
    default: 6
    description: "How many earlier chat turns an Ask sends along with the card, newest first. The whole prompt also stays under a 40,000-character budget."
  ask_persist_replies:
    type: bool
    default: false
    description: "Keep finished Ask answers on disk (owner-only, 15 minutes, at most 256 files) so a gateway restart can still show them. Off by default: an answer is private text derived from the card. Restart markers without any text are always kept so a restart never resends a request."
  comment_author:
    type: str
    default: ""
    description: "Author name used when UNBL0CK comments your answer on a Kanban card. Defaults to the first principal_name, else \"user\"."
  ask_enabled:
    type: bool
    default: true
    description: "Show the in-panel 'Ask about this card' chat. When you press Send, the card's content and your question go to the model provider configured in Hermes through its plugin LLM API."
  owner_user_ids:
    type: str
    default: ""
    description: "Your own user ids on gateway platforms (Discord, Telegram, ...), comma-separated. When set, a gateway chat with anyone else is not listed as asking you. When empty, such cards say who the chat is with."
  bluf_enabled:
    type: bool
    default: true
    description: "Lead each card with a one-line model-written summary. Each new or changed Kanban card's, chat's, agent-filed item's or watched-folder file's title and text are sent once to the model provider configured in Hermes (through its plugin LLM API) and the summary is cached in plugin-data. Keys, tokens and home-directory paths are scrubbed from that text before it leaves your machine. Set false to send nothing automatically."
  require_answer_version:
    type: bool
    default: false
    description: "Refuse Kanban answers that omit the queue item version (HTTP 428). Off keeps older clients working; their answers are accepted against the current block and flagged with a Warning header. Desktop always sends the version."
  outside_recursive:
    type: bool
    default: false
    description: "Also read .eml/.md/.txt files in nested folders under each watched folder, read-only. Bounded to 3 levels, 5,000 directory entries and 2 seconds per folder; symlinks, dotfolders and anything resolving outside the watched folder are skipped. Off reads direct files only."
  outside_eml_kind:
    type: str
    default: draft
    description: "What a watched-folder .eml is called when its own headers do not say: draft (default), notes, approval or other. A message marked unsent by its mail client is always a draft, and one with received-mail headers is never called a draft. Only changes the label; the text is read the same way."
  chat_window_days:
    type: int
    default: 14
    description: "How many days back chats are read for unanswered asks (1 to 90; anything else uses 14). Widening it is a read-only backfill of the same local chat database: nothing is sent to a model, chats are read in place, at most 500 sessions per profile per refresh, and hidden or answered items stay hidden. The queue reports the window it actually used."
  outside_dirs:
    type: str
    default: ""
    description: "Comma-separated absolute folders (~ expanded) to watch read-only for .eml mail and .md/.txt notes. Empty means off. Other known export formats (.msg, .mbox, documents, audio) are not read and are reported by count. Regular files only (nested folders only when outside_recursive is on); newest 200 waiting files per folder, 256 KiB per file. Fallback: UNBL0CK_OUTSIDE_DIRS."
